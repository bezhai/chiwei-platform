# cpu1 (node-role: infra) 没有外网，所有镜像必须从内网 Harbor 拉。
# Harbor 里镜像名被拍平成 library/<短名>，所以 registry 和 repository 都要覆盖。
# 节点 containerd 已配 robot 拉取凭据，无需 imagePullSecrets。

grafana:
  # adminPassword set via --set grafana.adminPassword=... at install time
  image:
    registry: harbor.local:30002
    repository: library/grafana
    tag: "12.4.0"
  initChownData:
    image:
      registry: harbor.local:30002
      repository: library/busybox
      tag: "1.37.0"
  sidecar:
    image:
      registry: harbor.local:30002
      repository: library/k8s-sidecar
      tag: "2.5.0"
  grafana.ini:
    security:
      allow_embedding: true
  service:
    type: NodePort
    nodePort: 30030
  persistence:
    enabled: true
    storageClassName: ""
    existingClaim: pvc-grafana
  nodeSelector:
    node-role: infra
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
      isDefault: false

prometheusOperator:
  image:
    registry: harbor.local:30002
    repository: library/prometheus-operator
    tag: "v0.89.0"
  # 注入成 operator 的 --prometheus-config-reloader= 参数，
  # operator 用它给每个 Prometheus/Alertmanager Pod 挂 config-reloader sidecar
  prometheusConfigReloader:
    image:
      registry: harbor.local:30002
      repository: library/prometheus-config-reloader
      tag: "v0.89.0"
  admissionWebhooks:
    # 装 ValidatingWebhookConfiguration 证书的一次性 Job。
    # 镜像目前还没镜像到 Harbor（原始出处 ghcr.io/jkroepke/kube-webhook-certgen:1.7.8）
    patch:
      image:
        registry: harbor.local:30002
        repository: library/kube-webhook-certgen
        tag: "1.7.8"

prometheus:
  prometheusSpec:
    image:
      registry: harbor.local:30002
      repository: library/prometheus
      tag: "v3.10.0"
    nodeSelector:
      node-role: infra
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
      runAsNonRoot: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ""
          volumeName: pv-prometheus
          resources:
            requests:
              storage: 10Gi

# k3s 内嵌了这些组件，没有独立 Pod/endpoint，禁用相关误报规则
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  rules:
    kubeSchedulerAlerting: false
    kubeControllerManager: false

nodeExporter:
  enabled: true

# nodeExporter.enabled 的 subchart，镜像 key 在 subchart 命名空间下
prometheus-node-exporter:
  image:
    registry: harbor.local:30002
    repository: library/node-exporter
    tag: "v1.10.2"

kubeStateMetrics:
  enabled: true

# kubeStateMetrics.enabled 的 subchart，镜像 key 在 subchart 命名空间下
kube-state-metrics:
  image:
    registry: harbor.local:30002
    repository: library/kube-state-metrics
    tag: "v2.18.0"

alertmanager:
  enabled: true
  alertmanagerSpec:
    image:
      registry: harbor.local:30002
      repository: library/alertmanager
      tag: "v0.31.1"
    nodeSelector:
      node-role: infra
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ""
          volumeName: pv-alertmanager
          resources:
            requests:
              storage: 2Gi
  config:
    global:
      resolve_timeout: 5m
    # 夜间静音窗口，供 LarkInboundEventsSilent 使用。
    #
    # 时间**刻意用 UTC 表示**：16:00-24:00 UTC = 次日 00:00-08:00 北京时间。
    # 不写 location: Asia/Shanghai，因为一旦镜像里缺 tzdata，未知时区会让整份
    # Alertmanager 配置加载失败——那是所有告警全哑，比夜间误报严重得多。
    # 中国不实行夏令时，UTC+8 恒定，这个换算不会漂。
    time_intervals:
      - name: night-cn
        time_intervals:
          - times:
              - start_time: '16:00'
                end_time: '24:00'
    route:
      receiver: feishu
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers:
            - alertname =~ "InfoInhibitor|Watchdog"
          receiver: "null"
        # 入站断流告警夜里不吵：0-8 点本来就可能真的没人说话，
        # 45m 窗口在低峰期必然误报。连接类告警（ConnectFailure /
        # ReconnectStorm）是确定性信号，不静音、全天有效。
        #
        # mute 的语义要清楚：它只抑制**通知**，不清除 firing 状态。所以
        #   - 夜里一直没恢复的故障，08:00 后一个 group_interval 内会补发（符合预期）
        #   - 夜里发生又自行恢复的故障，不会补报，早上什么都看不到
        #   - 若告警在静音前已通知，其 resolved 落在静音窗口内会被吞掉，
        #     群里可能留下一条永不消解的告警
        # 这是拿「夜间不被误报吵醒」换来的，接受。
        - matchers:
            - alertname = "LarkInboundEventsSilent"
          receiver: feishu
          mute_time_intervals:
            - night-cn
    receivers:
      - name: feishu
        webhook_configs:
          - url: 'http://alert-webhook.prod.svc.cluster.local:8080/webhook'
            send_resolved: true
      - name: "null"
